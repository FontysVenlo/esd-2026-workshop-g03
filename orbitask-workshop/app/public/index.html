<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbitask Connect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"></span>Orbitask <b>Connect</b></div>
  <div class="search" aria-hidden="true">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span>Search</span>
  </div>
  <div class="me">
    <span id="teamLabel" class="team-pill" hidden></span>
    <span class="avatar me-avatar" title="You">You</span>
  </div>
</header>

<nav class="rail" aria-label="Main">
  <button class="rail-btn" data-view="activity" title="Activity">
    <svg viewBox="0 0 24 24"><path d="M6 10a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    <span>Activity</span><i class="badge" id="badgeActivity" hidden>1</i>
  </button>
  <button class="rail-btn" data-view="chat" title="Chat">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
    <span>Chat</span><i class="badge" id="badgeChat" hidden>1</i>
  </button>
  <button class="rail-btn" data-view="editor" title="Process editor">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="5" rx="1"/><rect x="14" y="15" width="7" height="5" rx="1"/><path d="M6.5 9v4.5h11V15"/></svg>
    <span>Processes</span>
  </button>
  <button class="rail-btn" data-view="guide" title="Workshop guide">
    <svg viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 8h6M9 12h6"/></svg>
    <span>Guide</span>
  </button>
</nav>

<main id="main">
  <!-- welcome -->
  <section class="view" id="view-welcome">
    <div class="welcome-card">
      <div class="welcome-logo" aria-hidden="true"></div>
      <h1>Welcome to Orbitask</h1>
      <p>You just joined Orbitask as a <b>business-process consultant</b>. Managers will contact you here when
        they need a process improved.</p>
      <label for="teamInput">Your team (names or group name)</label>
      <input id="teamInput" maxlength="120" placeholder="e.g. Group 3 – Lisa, Tom, Amir" autocomplete="off">
      <button id="startBtn" class="primary">Start my first day</button>
      <p class="hint">Your work is saved automatically inside this container.</p>
    </div>
  </section>

  <!-- activity -->
  <section class="view" id="view-activity" hidden>
    <div class="pane-title">Activity</div>
    <div id="activityList" class="activity-list"></div>
  </section>

  <!-- chat -->
  <section class="view chat-layout" id="view-chat" hidden>
    <aside class="chat-list">
      <div class="pane-title">Chat</div>
      <button class="chat-item" id="chatItemManager" data-chat="manager"></button>
      <button class="chat-item" id="chatItemGuide" data-chat="guide">
        <span class="avatar bot">?</span>
        <span class="ci-text"><b>Workshop guide</b><small>How to work on your request</small></span>
      </button>
    </aside>
    <div class="conversation">
      <div class="conv-head" id="convHead"></div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="replyInput" rows="2" placeholder="Type your reply to the manager… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="primary" type="submit" title="Send">
          <svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4l3 8zM6 12h7"/></svg>
        </button>
      </form>
    </div>
  </section>

  <!-- editor -->
  <section class="view editor-layout" id="view-editor" hidden>
    <div class="editor-bar">
      <button class="ghost" id="toggleBrief" title="Show / hide the request">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        Request
      </button>
      <span class="ticket-chip" id="ticketChip"></span>
      <span class="save-status" id="saveStatus">Opening editor…</span>
      <span class="spacer"></span>
      <button class="ghost" id="restoreBtn">Restore original</button>
      <button class="primary" id="handinBtn">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Hand in (download)
      </button>
    </div>
    <div class="editor-body">
      <aside class="brief" id="brief"></aside>
      <div class="frame-wrap" id="frameWrap"><div class="frame-loading">Loading draw.io…</div></div>
    </div>
  </section>

  <!-- guide -->
  <section class="view" id="view-guide" hidden>
    <div class="guide" id="guide"></div>
  </section>
</main>

<div class="toast" id="toast" role="alert" hidden></div>
<dialog id="confirmDlg">
  <form method="dialog">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="dlg-actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="ok" class="primary" id="confirmOk">OK</button>
    </div>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
